# Builds Curvelet's desktop installers on GitHub's machines.
#   - Run it by hand: Actions → Desktop apps → Run workflow. The installers are attached
#     to the run under "Artifacts".
#   - Push a version tag (git tag v0.2.1 && git push origin v0.2.1): the same builds, published
#     as a release of this repository with latest.json, which installed apps read to offer the
#     update. Needs the secret TAURI_SIGNING_PRIVATE_KEY (signs the updates; the public half is
#     in tauri.conf.json).
name: Desktop apps

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write # only used to publish the release on a tag

concurrency:
  group: desktop-${{ github.ref }}
  # a newer push replaces a test build, but a release always runs to the end
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    name: ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64)
            os: windows-latest
            args: ''
            rust-targets: ''
          - name: macOS (Apple silicon)
            os: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - name: Linux (x64)
            os: ubuntu-22.04
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux libraries for the web view
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      # the web build (with Pyodide and SymPy) is made by Tauri's beforeBuildCommand
      - run: npm ci

      - name: Build the installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # signs the update files, so installed apps only take updates made here
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # set this repository variable to your web address so share links from the app work
          VITE_PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}
          # on a version tag: a published release here; otherwise just the build
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Curvelet {0}', github.ref_name) || '' }}
          releaseBody: Installers for Windows, macOS and Linux. Installed apps update themselves. The macOS and Windows builds are not code-signed yet, so the first install shows a warning.
          releaseDraft: false
          includeUpdaterJson: true

      - name: Keep the installers with this run
        uses: actions/upload-artifact@v4
        with:
          name: curvelet-${{ runner.os }}-${{ matrix.rust-targets || 'x64' }}
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/**/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/**/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/**/release/bundle/rpm/*.rpm
          if-no-files-found: error
