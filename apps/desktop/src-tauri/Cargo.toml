[package]
name = "curvelet"
version = "0.1.0"
description = "Graphing, symbolic math, geometry and worksheets, offline"
edition = "2021"

[lib]
name = "curvelet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
# a smaller app: the work happens in the web view and the WebAssembly engine
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
