[package]
name = "curvelet"
version = "0.2.1"
description = "Graphing, symbolic math, geometry and worksheets, offline"
edition = "2021"

[lib]
name = "curvelet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# the native Save dialog for exports and project files
tauri-plugin-dialog = "2"
base64 = "0.22"
# updates: signed releases listed on this repository's releases page
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
# generate_context! writes the plugins' settings with it
serde_json = "1"

[profile.release]
# a smaller app: the work happens in the web view and the WebAssembly engine
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
