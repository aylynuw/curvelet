<!doctype html>
<html><head><meta charset="utf-8">
<style>
  :root { --paper: #fbfaf6; --minor: #e8edf4; --major: #d9e1ec; --ink: #1b2533; --muted: #8a96a8; --faint: #b7c3d4; --blue: #1c65c8; }
  html, body { margin: 0; width: 660px; height: 400px; overflow: hidden; background: var(--paper); }
  svg { display: block; }
  .sans { font-family: -apple-system, "SF Pro Text", "Apple SD Gothic Neo", sans-serif; }
  .math { font-family: "STIXGeneral", "Times New Roman", serif; }
</style></head>
<body>
<svg width="660" height="400" viewBox="0 0 660 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="minor" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="var(--minor)" stroke-width="1"/></pattern>
    <pattern id="major" width="100" height="100" patternUnits="userSpaceOnUse" x="30" y="0"><path d="M100 0H0V100" fill="none" stroke="var(--major)" stroke-width="1"/></pattern>
    <marker id="head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="var(--blue)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="660" height="400" fill="url(#minor)"/>
  <rect width="660" height="400" fill="url(#major)"/>

  <!-- faint axes and curves: the page is a graph -->
  <g stroke="var(--faint)" stroke-width="1.2" fill="none">
    <path d="M0 330H650"/><path d="M644 326l6 4-6 4"/>
    <path d="M330 400V12"/><path d="M326 18l4-6 4 6"/>
  </g>
  <text x="640" y="350" class="math" font-style="italic" font-size="15" fill="var(--muted)">x</text>
  <text x="338" y="24" class="math" font-style="italic" font-size="15" fill="var(--muted)">y</text>
  <path d="M0 360 C 30 305, 60 305, 90 360 S 150 415, 180 360" fill="none" stroke="var(--faint)" stroke-width="1.4" opacity=".8"/>
  <path d="M480 400 Q 565 250 650 400" fill="none" stroke="var(--faint)" stroke-width="1.4" opacity=".8"/>

  <!-- brand -->
  <g transform="translate(30 28)">
    <rect width="30" height="30" rx="8" fill="var(--blue)"/>
    <path d="M7.5 19.5c2.8 0 3.2-9 7.5-9s4.7 9 7.5 9" stroke="#fbfcfe" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  </g>
  <text x="70" y="50" class="sans" font-size="21" font-weight="650" fill="var(--ink)">Curvelet</text>
  <text x="70" y="70" class="sans" font-size="12" fill="var(--muted)">Graphs, exact answers, geometry</text>

  <!-- formulas in the margins -->
  <g class="math" fill="var(--muted)" opacity=".75">
    <text x="462" y="54" font-size="18"><tspan font-size="24" dy="3">∫</tspan><tspan font-size="11" dy="3">0</tspan><tspan font-size="11" dx="-2" dy="-19">1</tspan><tspan dx="4" dy="16" font-style="italic">x</tspan><tspan font-size="11" dy="-7">2</tspan><tspan dy="7" font-style="italic"> dx</tspan> = ⅓</text>
    <text x="500" y="88" font-size="17"><tspan font-style="italic">e</tspan><tspan font-size="11" dy="-7"><tspan font-style="italic">i</tspan>π</tspan><tspan dy="7"> + 1 = 0</tspan></text>
    <text x="30" y="122" font-size="16">sin² <tspan font-style="italic">θ</tspan> + cos² <tspan font-style="italic">θ</tspan> = 1</text>
  </g>

  <!-- the move: an arc from the app to Applications -->
  <path d="M236 176 Q 330 96 422 174" fill="none" stroke="var(--blue)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/>
  <text x="330" y="112" text-anchor="middle" font-size="17" fill="var(--blue)"><tspan class="math" font-style="italic">f</tspan><tspan class="math"> : </tspan><tspan class="sans" font-size="14">Curvelet</tspan><tspan class="math"> ↦ </tspan><tspan class="sans" font-size="14">Applications</tspan></text>

  <text x="330" y="372" text-anchor="middle" class="sans" font-size="12.5" fill="var(--ink)">Drag Curvelet to Applications</text>
  <text x="330" y="390" text-anchor="middle" class="sans" font-size="11" fill="var(--muted)">Then open it from Launchpad. Everything works offline.</text>
</svg>
</body></html>
